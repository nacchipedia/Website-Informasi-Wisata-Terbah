<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Wisata Alam Terbah</title>
    <link rel="icon" href="./Assets/logo_terbah_icon.ico" type="image/x-icon">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            padding-bottom: 40px;
        }

        /* NAVBAR STYLE - LOGO DI TENGAH ATAS */
        .navbar {
            background-color: white;
            padding: 20px 40px;
            /* Menggunakan Grid agar seimbang Kiri - Tengah - Kanan */
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        .nav-left {
            /* Area kosong di kiri agar logo terkunci di tengah */
        }

        .nav-brand {
            display: flex;
            flex-direction: column;
            /* Menumpuk logo dan teks dari atas ke bawah */
            align-items: center;
            gap: 10px;
            text-decoration: none;
            justify-self: center;
            /* Mengunci posisi di tengah layar */
        }

        .nav-brand img {
            height: 100px;
            /* LOGO DIPERBESAR (sebelumnya 45px) */
            width: auto;
        }

        .nav-brand h1 {
            margin: 0;
            color: #2e7d32;
            font-size: 24px;
            font-weight: bold;
        }

        .nav-buttons {
            display: flex;
            justify-content: flex-end;
            /* Memaksa tombol ke pojok kanan */
            gap: 15px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
            padding: 0 20px;
        }

        .admin-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        h2 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #2e7d32;
            padding-bottom: 10px;
            font-size: 20px;
        }

        /* FORM STYLE */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #444;
            font-size: 14px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #2e7d32;
            box-shadow: 0 0 5px rgba(46, 125, 50, 0.2);
        }

        /* BUTTONS */
        button.btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        button.btn-submit:hover {
            background-color: #1b5e20;
        }

        .btn-history {
            background-color: #17a2b8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .btn-history:hover {
            background-color: #138496;
        }

        .btn-logout {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .btn-logout:hover {
            background-color: #c82333;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-delete:hover {
            background-color: #c82333;
        }

        .btn-edit {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-edit:hover {
            background-color: #0056b3;
        }

        /* ALERTS & DRAG DROP */
        .alert {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            text-align: center;
            display: none;
            font-weight: 500;
        }

        .alert.success {
            background-color: #d4edda;
            color: #155724;
            display: block;
        }

        .alert.error {
            background-color: #f8d7da;
            color: #721c24;
            display: block;
        }

        .drop-zone {
            width: 100%;
            height: 150px;
            padding: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            color: #999;
            border: 3px dashed #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            background-color: #fafafa;
            transition: border-color 0.3s, background-color 0.3s;
        }

        .drop-zone--over {
            border-color: #2e7d32;
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .drop-zone__input {
            display: none;
        }

        /* TABLE STYLE */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px 15px;
            text-align: left;
        }

        th {
            background-color: #2e7d32;
            color: white;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .action-btns {
            display: flex;
            gap: 5px;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
        }

        .modal-content {
            background-color: #fff;
            margin: 5% auto;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-height: 80vh;
            overflow-y: auto;
        }

        .close-btn {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 20px;
        }

        .close-btn:hover {
            color: black;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: white;
            font-weight: bold;
        }

        .badge-tambah {
            background-color: #28a745;
        }

        .badge-edit {
            background-color: #007bff;
        }

        .badge-hapus {
            background-color: #dc3545;
        }
    </style>
</head>

<body>

    <!-- NAVBAR ATAS (LOGO DI TENGAH) -->
    <nav class="navbar">
        <div class="nav-left"></div> <!-- Sengaja dikosongkan agar proporsional -->

        <a href="/index.html" class="nav-brand" title="Ke Halaman Publik">
            <img src="./Assets/logo_terbah.png" alt="Logo Terbah">
            <h1>CMS Terbah</h1>
        </a>

        <div class="nav-buttons">
            <button onclick="openHistory()" class="btn-history">Riwayat Log</button>
            <button onclick="logout()" class="btn-logout">Keluar</button>
        </div>
    </nav>

    <div class="container">
        <!-- Kotak Form -->
        <div class="admin-card">
            <h2>Tambah / Edit Galeri Wisata</h2>
            <div id="messageBox" class="alert"></div>

            <form id="galleryForm">
                <div class="form-group">
                    <label for="title">Judul Foto:</label>
                    <input type="text" id="title" required placeholder="Contoh: Pesona Bukit Terbah">
                </div>
                <div class="form-group">
                    <label for="description">Deskripsi Singkat:</label>
                    <textarea id="description" rows="3" required
                        placeholder="Tuliskan daya tarik objek wisata ini..."></textarea>
                </div>
                <div class="form-group">
                    <label>Upload Gambar:</label>
                    <div class="drop-zone" id="dropZone">
                        <span id="dropZoneText">Tarik & Lepas gambar ke sini, atau klik untuk memilih file</span>
                        <input type="file" name="imageFile" id="imageFile" class="drop-zone__input" accept="image/*"
                            required>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Simpan ke Database</button>
            </form>
        </div>

        <!-- Kotak Tabel -->
        <div class="admin-card">
            <h2>Manajemen Data Galeri</h2>
            <table id="dataTable">
                <thead>
                    <tr>
                        <th width="5%">No.</th>
                        <th width="25%">Judul</th>
                        <th width="50%">Deskripsi</th>
                        <th width="20%">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="4" style="text-align: center;">Memuat data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL POP-UP RIWAYAT -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeHistory()">&times;</span>
            <h2 style="margin-top:0; border-bottom:none;">Log Riwayat Perubahan</h2>
            <p style="color: #666; font-size:14px; margin-top:-10px; margin-bottom: 20px;">Mencatat seluruh aktivitas
                admin untuk transparansi data.</p>
            <table>
                <thead>
                    <tr>
                        <th width="20%">Waktu</th>
                        <th width="15%">Admin</th>
                        <th width="15%">Aksi</th>
                        <th width="50%">Objek / Konten</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                    <tr>
                        <td colspan="4" style="text-align: center;">Memuat riwayat...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        const token = localStorage.getItem('adminToken');
        if (!token) { window.location.href = '/login.html'; }
        function logout() { localStorage.removeItem('adminToken'); window.location.href = '/login.html'; }

        const modal = document.getElementById("historyModal");

        async function openHistory() {
            modal.style.display = "block";
            const historyBody = document.getElementById("historyBody");
            historyBody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Memuat...</td></tr>';

            try {
                const response = await fetch('/api/history', { headers: { 'Authorization': token } });
                const data = await response.json();
                historyBody.innerHTML = '';
                if (data.length === 0) { historyBody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Belum ada riwayat aktivitas.</td></tr>'; return; }

                data.forEach(log => {
                    const dateObj = new Date(log.createdAt);
                    const timeString = dateObj.toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    let badgeClass = "badge-tambah";
                    if (log.action === "Edit Data") badgeClass = "badge-edit";
                    if (log.action === "Hapus Data") badgeClass = "badge-hapus";

                    historyBody.innerHTML += `
                        <tr>
                            <td style="font-size: 13px;">${timeString}</td>
                            <td><strong>${log.username}</strong></td>
                            <td><span class="badge ${badgeClass}">${log.action}</span></td>
                            <td>${log.itemTitle}</td>
                        </tr>
                    `;
                });
            } catch (error) { historyBody.innerHTML = '<tr><td colspan="4" style="color:red; text-align: center;">Gagal memuat riwayat.</td></tr>'; }
        }

        function closeHistory() { modal.style.display = "none"; }
        window.onclick = function (event) { if (event.target == modal) { closeHistory(); } }

        const dropZone = document.getElementById("dropZone");
        const fileInput = document.getElementById("imageFile");
        const dropZoneText = document.getElementById("dropZoneText");
        let editMode = false; let editId = null;

        dropZone.addEventListener("click", () => fileInput.click());
        fileInput.addEventListener("change", function () { if (fileInput.files.length) updateThumbnail(fileInput.files[0]); });
        dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("drop-zone--over"); });
        ["dragleave", "dragend"].forEach((type) => { dropZone.addEventListener(type, () => dropZone.classList.remove("drop-zone--over")); });
        dropZone.addEventListener("drop", (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length) { fileInput.files = e.dataTransfer.files; updateThumbnail(e.dataTransfer.files[0]); }
            dropZone.classList.remove("drop-zone--over");
        });
        function updateThumbnail(file) {
            dropZoneText.innerHTML = `<strong>Terpilih:</strong> ${file.name}`;
            dropZoneText.style.color = "#2e7d32";
        }

        document.addEventListener('DOMContentLoaded', loadTableData);
        async function loadTableData() {
            const tableBody = document.getElementById('tableBody');
            try {
                const response = await fetch('/api/galleries');
                const galleries = await response.json();
                tableBody.innerHTML = '';
                if (galleries.length === 0) { tableBody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Belum ada data.</td></tr>'; return; }

                galleries.forEach((item, index) => {
                    tableBody.innerHTML += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${item.title}</td>
                            <td>${item.description.substring(0, 50)}...</td>
                            <td class="action-btns">
                                <button class="btn-edit" onclick="prepareEdit(${item.id}, '${item.title.replace(/'/g, "\\'")}', \`${item.description.replace(/`/g, "\\`")}\`)">Edit</button>
                                <button class="btn-delete" onclick="deleteGallery(${item.id})">Hapus</button>
                            </td>
                        </tr>`;
                });
            } catch (error) { console.error(error); }
        }

        function prepareEdit(id, title, description) {
            editMode = true; editId = id;
            document.getElementById('title').value = title;
            document.getElementById('description').value = description;
            document.querySelector('.btn-submit').textContent = "Simpan Perubahan (Update)";
            document.querySelector('.btn-submit').style.backgroundColor = "#007bff";
            fileInput.removeAttribute('required');
            dropZoneText.innerHTML = "Klik/Drop jika ingin GANTI gambar (Kosongkan jika tetap gambar lama)";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('galleryForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const messageBox = document.getElementById('messageBox');
            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('description', document.getElementById('description').value);
            if (fileInput.files[0]) formData.append('imageFile', fileInput.files[0]);

            let url = '/api/galleries';
            if (editMode) url = `/api/galleries/${editId}`;

            try {
                const response = await fetch(url, { method: 'POST', headers: { 'Authorization': token }, body: formData });
                if (response.ok) {
                    messageBox.className = 'alert success';
                    messageBox.textContent = editMode ? '✅ Data berhasil diperbarui!' : '✅ Data berhasil ditambahkan!';

                    editMode = false; editId = null; document.getElementById('galleryForm').reset();
                    document.querySelector('.btn-submit').textContent = "Simpan ke Database";
                    document.querySelector('.btn-submit').style.backgroundColor = "#2e7d32";
                    fileInput.setAttribute('required', 'required');
                    dropZoneText.innerHTML = "Tarik & Lepas gambar ke sini, atau klik untuk memilih file";
                    dropZoneText.style.color = "#999";

                    loadTableData();
                } else { throw new Error('Gagal'); }
            } catch (error) {
                messageBox.className = 'alert error';
                messageBox.textContent = '❌ Gagal mengeksekusi data.';
            }
        });

        async function deleteGallery(id) {
            if (confirm("Hapus foto ini?")) {
                try {
                    const res = await fetch(`/api/galleries/${id}`, { method: 'DELETE', headers: { 'Authorization': token } });
                    if (res.ok) loadTableData(); else alert("Gagal");
                } catch (e) { alert("Error server"); }
            }
        }
    </script>
</body>

</html>
